name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The template's own tests run TypeScript directly on Node.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Keep this in sync with local setup. Stack-specific dependency
      # installation belongs in the Makefile's `setup` target.
      - name: Set up
        run: make setup

      - name: Check
        run: make check
